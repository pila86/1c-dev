# Toolchain pin manifest (ADR-013). SoT for `1c-dev tools sync`.
version: 1
components:
  - id: xml-gen
    artifact: xml-gen.jar
    # Meta DSL 23 (meta compile/edit/remove) + subsystem compile/edit (ADR-018 / #60)
    pin: "19f67bfed6d15f051f9568678bab1701b7735f95"
    source:
      type: git
      repo: https://github.com/SteelMorgan/1c-agent-based-dev-framework.git
      sparse_path: tools/xml-gen
    min_java: 17
    env: ONEC_XMLGEN_JAR

  - id: md-reader
    artifact: md-reader.jar
    pin: mdclasses-0.20.0
    source:
      type: local-build
      path: tools/md-reader
    min_java: 21
    env: ONEC_MDREADER_JAR

  - id: bsl-language-server
    artifact: bsl-language-server.jar
    # 1.1.0-rc.4: register_workspace_folder — Cursor не отдаёт MCP roots (#4462)
    pin: "1.1.0-rc.4"
    source:
      type: github-release
      repo: 1c-syntax/bsl-language-server
      asset: bsl-language-server-1.1.0-rc.4-exec.jar
      url: https://github.com/1c-syntax/bsl-language-server/releases/download/v1.1.0-rc.4/bsl-language-server-1.1.0-rc.4-exec.jar
    min_java: 21
    env: ONEC_BSLLS_JAR
    sha256: "55f4695766a671591e9f7c1fdbaa72933b7ef0b2bc92dba9553cf26697a99a50"

  - id: docs-facade
    artifact: docs-facade.jar
    pin: bsl-context-0.10.0
    source:
      type: local-build
      path: tools/docs-facade
    min_java: 21
    env: ONEC_DOCS_FACADE_JAR

  # Soft: YaXUnit runner extension (.cfe), Apache-2.0 (ADR-029 §7a).
  # Тесты живут в src/ проекта; runner подключается в ИБ неявным `ensure` из cache.
  - id: yaxunit
    artifact: yaxunit.cfe
    pin: "25.12"
    source:
      type: github-release
      repo: bia-technologies/yaxunit
      asset: YAxUnit-25.12.cfe
      url: https://github.com/bia-technologies/yaxunit/releases/download/25.12/YAxUnit-25.12.cfe
    env: ONEC_YAXUNIT_CFE
    sha256: "805a2277c997a3c24be0b0d080696479e91e4a15ed7e27aaf3991a7346522d70"

  # Soft: user-owned httpd home for publish/webinst (#94).
  # Unix: tools sync собирает ASF httpd+apr+apr-util в ~/.cache/1c-dev/tools/apache/
  # (нужны gcc/make/libpcre2-dev). Fallback для разработчиков: ./scripts/fetch-apache.sh
  # Windows: prebuilt zip (Apache Lounge). Override: ONEC_APACHE_HOME.
  - id: apache
    artifact: apache
    pin: "2.4.68"
    source:
      type: apache-home
      build:
        httpd: https://downloads.apache.org/httpd/httpd-2.4.68.tar.gz
        apr: https://downloads.apache.org/apr/apr-1.7.6.tar.gz
        apr_util: https://downloads.apache.org/apr/apr-util-1.6.5.tar.gz
      urls:
        windows_amd64: https://www.apachelounge.com/download/VS17/binaries/httpd-2.4.66-251206-Win64-VS17.zip
    env: ONEC_APACHE_HOME
