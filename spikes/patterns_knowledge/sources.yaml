      - "plugins/unica/references/platform/document-posting.md"
      - "plugins/unica/references/platform/transactions-locks.md"
      - "plugins/unica/references/platform/object-locks.md"
      - "plugins/unica/references/platform/register-design.md"
      - "plugins/unica/references/platform/form-events.md"
      - "plugins/unica/references/platform/object-events.md"
