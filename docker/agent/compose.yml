# OpenHands Agent Canvas + 1c-agent sandbox + sibling MCP tools.
#
# Build:
#   ./docker/agent/build-oh.sh
# Run:
#   cp docker/agent/.env.example docker/agent/.env
#   docker compose -f docker/agent/compose.yml --env-file docker/agent/.env up -d
#
# UI: http://127.0.0.1:3000/canvas
# Debug sandbox (VNC+/health): --profile debug
# Heavy bsl-search (ES): --profile mcp-search
#
# Git workspace: bind-mount GIT_REPO_HOST_PATH into conversation /workspace
# and into sibling bsl-ls at the same path (register_workspace_folder).
# (no clone at image build). UI isolated-workspaces are bypassed via docker-wrapper.
#
# Sibling MCP (bsl-ls, v8std) share the compose network. docker-wrapper attaches
# each conversation with --network 1c-agent_default so DNS names resolve.

name: 1c-agent

services:
  openhands:
    image: ${OPENHANDS_APP_IMAGE:-ghcr.io/openhands/agent-canvas:latest}
    container_name: 1c-openhands
    # Host network is required for OH_CONVERSATION_RUNTIME=docker when Canvas
    # itself runs in a container: conversation ports are published on the host
    # as 127.0.0.1:<ephemeral>, and the outer Agent Server health-checks that
    # address. Bridge networking makes those checks hit the Canvas container.
    network_mode: host
    group_add:
      - "${DOCKER_GID:-137}"
    environment:
      PORT: ${OPENHANDS_PORT:-3000}
      OH_BIND_HOST: "127.0.0.1"
      OH_CONVERSATION_RUNTIME: ${OH_CONVERSATION_RUNTIME:-docker}
      OH_CONVERSATION_IMAGE: ${OH_CONVERSATION_IMAGE:-1c-agent-oh:8.5.1-edt2026.2}
      OH_CONVERSATION_CONTAINER_MEMORY: ${OH_CONVERSATION_CONTAINER_MEMORY:-16g}
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY:-1c-agent-oh}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG:-8.5.1-edt2026.2}
      OH_AGENT_SERVER_VERSION: ${OH_AGENT_SERVER_VERSION:-1.64.1}
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:-}
      OH_SECRET_KEY: ${OH_SECRET_KEY:-}
      AGENT_CANVAS_DISABLE_TELEMETRY: ${AGENT_CANVAS_DISABLE_TELEMETRY:-1}
      HASP_SERVER_ADDR: ${HASP_SERVER_ADDR:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      ORG_CERTS_DIR: /certs
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,host.docker.internal,bsl-ls,v8std-mcp,v8std,v8std-site,mcp,mcp-atlassian,192.168.0.0/16}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,host.docker.internal,bsl-ls,v8std-mcp,v8std,v8std-site,mcp,mcp-atlassian,192.168.0.0/16}
      # Bind-mount host entrypoint/scripts into conversations (no OH image rebuild).
      OH_INJECT_OH_ENTRYPOINT: ${OH_AGENT_HOST_DIR:-}/entrypoint-openhands.sh
      OH_INJECT_OH_SCRIPTS: ${OH_AGENT_HOST_DIR:-}/scripts
      MCP_ATLASSIAN_PORT: ${MCP_ATLASSIAN_PORT:-18768}
      EDT_JAVA_XMX: ${EDT_JAVA_XMX:-8g}
      OH_INJECT_GIT_REPO_HOST_PATH: ${GIT_REPO_HOST_PATH:-}
      OH_INJECT_GIT_REPO_URL: ${GIT_REPO_URL:-}
      OH_INJECT_GIT_BRANCH: ${GIT_BRANCH:-}
      OH_INJECT_IMAGE_MATCH: ${AGENT_SERVER_IMAGE_REPOSITORY:-1c-agent-oh}
      OH_INJECT_TOOLCHAIN_CACHE_HOST: ${TOOLCHAIN_CACHE_HOST_DIR:-/home/openhands/.openhands/1c-dev-cache}
      OH_INJECT_TOOLS_SHARE_HOST: ${TOOLS_SHARE_HOST_DIR:-/home/openhands/.openhands/1c-dev-share}
      # Join conversations to this compose project network (DNS → bsl-ls, v8std).
      OH_INJECT_COMPOSE_NETWORK: ${OH_COMPOSE_NETWORK:-1c-agent_default}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-OpenHands Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-openhands@local}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-OpenHands Agent}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-openhands@local}
      # Sibling MCP in compose — do not start bsl-ls again inside conversation.
      SKIP_TOOLS_BOOTSTRAP: ${SKIP_TOOLS_BOOTSTRAP:-1}
      TOOLS_BOOTSTRAP_SERVICES: ${TOOLS_BOOTSTRAP_SERVICES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_HOST_DATA_DIR:-/home/openhands/.openhands}:/home/openhands/.openhands
      - ${PROJECTS_DIR:-./projects}:/projects
      - ${ORG_CERTS_HOST_DIR:-./certs}:/certs:ro
      - ${GIT_REPO_HOST_PATH}:${GIT_REPO_HOST_PATH}
      - ./scripts/docker-wrapper.sh:/usr/local/bin/docker:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:${OPENHANDS_PORT:-3000}/api/settings",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # --- Sibling MCP tools (compose DNS; conversation joins via docker-wrapper) ---

  bsl-ls:
    image: ${BSL_LS_IMAGE:-eclipse-temurin:21-jre-jammy}
    container_name: 1c-bsl-ls
    environment:
      BSLLS_MCP_PORT: ${BSLLS_MCP_PORT:-18767}
      BSLLS_JAR: /data/bsl-language-server.jar
      BSLLS_DOWNLOAD_URL: ${BSLLS_DOWNLOAD_URL:-https://github.com/1c-syntax/bsl-language-server/releases/download/v1.1.0-rc.9/bsl-language-server-1.1.0-rc.9-exec.jar}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
    volumes:
      - bsl_ls_data:/data
      - ./scripts/run-bsl-ls.sh:/usr/local/bin/run-bsl-ls.sh:ro
      # Prefer pre-installed jar from tools share when present
      - ${TOOLS_SHARE_HOST_DIR:-/home/openhands/.openhands/1c-dev-share}/tools/bsl-ls/lib:/share-lib:ro
      # Same host checkout as conversation /workspace. Agent calls
      # register_workspace_folder("/workspace") — path must exist here too.
      - ${GIT_REPO_HOST_PATH:-./projects}:/workspace:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /share-lib/bsl-language-server.jar ] && [ ! -s /data/bsl-language-server.jar ]; then
          cp -a /share-lib/bsl-language-server.jar /data/bsl-language-server.jar
        fi
        exec /bin/sh /usr/local/bin/run-bsl-ls.sh
    ports:
      # Canvas (host network) Test + curl from host; conversation uses forwarder.
      - "127.0.0.1:${BSLLS_MCP_PORT:-18767}:18767"
    networks:
      default:
        aliases: [bsl-ls]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18767' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # v8std: site (corpus + MCP proxy :8001) + mcp worker on internal alias.
  v8std-site:
    image: ${V8STD_SITE_IMAGE:-ghcr.io/zeegin/v8std-site:sha-58fff9f7cce57e98c884e01eded360236cfa47ee}
    container_name: 1c-v8std-site
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001"]
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'sed "s/listen 8000;/listen 18765;/" /etc/nginx/nginx.conf > /tmp/site.conf; exec nginx -c /tmp/site.conf -g "daemon off;"'
    networks:
      default:
        aliases: [v8std, v8std-site, v8std.localhost]
    restart: unless-stopped
    depends_on:
      - v8std-mcp

  v8std-mcp:
    image: ${V8STD_MCP_IMAGE:-ghcr.io/zeegin/v8std-mcp:sha-58fff9f7cce57e98c884e01eded360236cfa47ee}
    container_name: 1c-v8std-mcp
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"]
    mem_limit: 1536m
    volumes:
      - v8std_mcp_cache:/var/lib/v8std-mcp
    environment:
      V8STD_MCP_SITE_URL: http://v8std-site:18765/
      V8STD_MCP_MAX_SNIPPET_CHARS: "4000"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,v8std-site,v8std}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,v8std-site,v8std}
    command: [--transport, streamable-http, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:${V8STD_MCP_PORT:-18766}:8000"
    networks:
      default:
        # Alias `mcp` — site nginx upstream from upstream compose naming.
        aliases: [v8std-mcp, mcp]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 3

  # Jira/Confluence MCP (HTTP sibling; same pattern as v8std).
  # Creds: Cloud = JIRA_USERNAME + JIRA_API_TOKEN; Server/DC = JIRA_PERSONAL_TOKEN.
  # Official image ≡ uvx mcp-atlassian; streamable-http on /mcp.
  mcp-atlassian:
    image: ${MCP_ATLASSIAN_IMAGE:-ghcr.io/sooperset/mcp-atlassian:latest}
    container_name: 1c-mcp-atlassian
    # Jira hostname often resolves only via corp proxy — keep HTTP(S)_PROXY,
    # and do NOT put jira.* into NO_PROXY.
    environment:
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN:-}
      JIRA_SSL_VERIFY: ${JIRA_SSL_VERIFY:-false}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_PERSONAL_TOKEN: ${CONFLUENCE_PERSONAL_TOKEN:-}
      CONFLUENCE_SSL_VERIFY: ${CONFLUENCE_SSL_VERIFY:-false}
      # OH clients do not send per-request auth headers — use server env creds.
      ALLOW_GLOBAL_CRED_FALLBACK: "true"
      FASTMCP_HTTP_HOST_ORIGIN_PROTECTION: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
    volumes:
      - ${ORG_CERTS_HOST_DIR:-./certs}:/certs:ro
    command:
      [
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--stateless",
      ]
    ports:
      - "127.0.0.1:${MCP_ATLASSIAN_PORT:-18768}:9000"
    networks:
      default:
        aliases: [mcp-atlassian]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',9000),2); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Optional: heavy Elasticsearch + bsl-search (profile mcp-search).
  bsl-search-es:
    profiles: ["mcp-search"]
    image: ${BSL_SEARCH_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.3}
    container_name: 1c-bsl-search-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=${BSL_SEARCH_ES_JAVA_OPTS:--Xms1g -Xmx1g}
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - bsl_search_es_data:/usr/share/elasticsearch/data
    networks:
      default:
        aliases: [elasticsearch]
    mem_limit: ${BSL_SEARCH_ES_MEM_LIMIT:-2g}
    restart: unless-stopped

  # Placeholder note: full bsl-search app needs build from catalog upstream.
  # Enable profile after `1c-dev tools install bsl-search` and wire build context
  # if you need it; MCP URL seed is optional via MCP_HTTP_SERVERS=…,bsl-search.

  # Optional legacy: HTTP 1c-dev on host :9100 for Canvas UI Test only.
  mcp-1c-dev:
    profiles: ["mcp-http"]
    image: ${OH_CONVERSATION_IMAGE:-1c-agent-oh:8.5.1-edt2026.2}
    container_name: 1c-mcp-1c-dev
    network_mode: host
    environment:
      MCP_HTTP_HOST: ${MCP_HTTP_HOST:-127.0.0.1}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-9100}
      AGENT_WORKSPACE: /workspace
      HASP_SERVER_ADDR: ${HASP_SERVER_ADDR:-}
      ORG_CERTS_DIR: /certs
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,host.docker.internal}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,host.docker.internal}
      SKIP_DOCTOR: "1"
      SKIP_DISPLAY: "1"
    volumes:
      - ${GIT_REPO_HOST_PATH:-./projects}:/workspace
      - ${ORG_CERTS_HOST_DIR:-./certs}:/certs:ro
      - ./scripts/run-mcp-http.sh:/usr/local/bin/run-mcp-http.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/run-mcp-http.sh"]
    restart: unless-stopped

  openhands-mcp-bootstrap:
    image: ${MCP_BOOTSTRAP_IMAGE:-curlimages/curl:8.12.1}
    container_name: 1c-openhands-mcp-bootstrap
    network_mode: host
    depends_on:
      openhands:
        condition: service_started
      bsl-ls:
        condition: service_started
      v8std-site:
        condition: service_started
    environment:
      OH_API_BASE: http://127.0.0.1:${OPENHANDS_PORT:-3000}
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:-}
      WAIT_SECS: ${MCP_BOOTSTRAP_WAIT_SECS:-180}
      MCP_HTTP_SERVERS: ${MCP_HTTP_SERVERS:-bsl-ls,v8std,atlassian}
      MCP_BSL_LS_URL: ${MCP_BSL_LS_URL:-http://127.0.0.1:18767/mcp}
      MCP_V8STD_URL: ${MCP_V8STD_URL:-http://127.0.0.1:18766/mcp}
      MCP_BSL_SEARCH_URL: ${MCP_BSL_SEARCH_URL:-http://127.0.0.1:18005/mcp}
      MCP_ATLASSIAN_URL: ${MCP_ATLASSIAN_URL:-http://127.0.0.1:18768/mcp}
      # Avoid Privoxy swallowing sibling / loopback MCP probes from host Canvas.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local,host.docker.internal,bsl-ls,v8std-mcp,v8std,v8std-site,mcp,mcp-atlassian}
    volumes:
      - ./scripts/ensure-mcp-servers.sh:/ensure-mcp-servers.sh:ro
    entrypoint: ["/bin/sh", "/ensure-mcp-servers.sh"]
    restart: "no"

  sandbox-debug:
    profiles: ["debug"]
    image: ${OH_CONVERSATION_IMAGE:-1c-agent-oh:8.5.1-edt2026.2}
    container_name: 1c-agent-sandbox-debug
    environment:
      HASP_SERVER_ADDR: ${HASP_SERVER_ADDR:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      DISPLAY: ":99"
      SKIP_DOCTOR: ${SKIP_DOCTOR:-1}
      SKIP_TOOLS_BOOTSTRAP: "1"
      ORG_CERTS_DIR: /certs
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,.local}
      EDT_JAVA_XMX: ${EDT_JAVA_XMX:-8g}
      OH_CONVERSATION_RUNTIME: local
      SESSION_API_KEY: ${SESSION_API_KEY:-dev-local-key}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-OpenHands Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-openhands@local}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-OpenHands Agent}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-openhands@local}
    ports:
      - "${SANDBOX_PORT:-18000}:8000"
      - "${VNC_PORT:-5901}:5900"
    volumes:
      - ${GIT_REPO_HOST_PATH:-./projects}:/workspace
      - ${TOOLCHAIN_CACHE_HOST_DIR:-/home/openhands/.openhands/1c-dev-cache}:/root/.cache/1c-dev
      - ${TOOLS_SHARE_HOST_DIR:-/home/openhands/.openhands/1c-dev-share}:/root/.local/share/1c-dev
      - ${ORG_CERTS_HOST_DIR:-./certs}:/certs:ro
      - ${PROXY_ENV_FILE:-./proxy.env}:/etc/1c-agent/proxy.env:ro
    networks:
      default:
        aliases: [sandbox-debug]
    shm_size: "1gb"
    mem_limit: ${MEM_LIMIT:-16g}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sandbox_workspace:
  bsl_ls_data:
  v8std_mcp_cache:
  bsl_search_es_data:
