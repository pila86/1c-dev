plugins {
    id 'java'
    id 'application'
}

group = 'dev.onec'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Pin: MDClasses 0.20.0 (ADR-012). Fat jar installs to user cache via fetch-md-reader.
    implementation 'io.github.1c-syntax:mdclasses:0.20.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

application {
    mainClass = 'dev.onec.mdreader.Main'
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Build fat jar with runtime dependencies'
    archiveBaseName.set('md-reader')
    archiveClassifier.set('')
    archiveVersion.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'dev.onec.mdreader.Main')
    }
    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    with jar
}

tasks.named('build') {
    dependsOn tasks.named('fatJar')
}
